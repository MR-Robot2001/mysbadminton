<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Badminton Group Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- CryptoJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        [v-cloak] { display: none; }
    </style>
</head>
<body class="min-h-screen text-slate-800">

    <!-- App Container -->
    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col">
        
        <!-- Header -->
        <header class="p-4 bg-white border-b sticky top-0 z-50 flex justify-between items-center">
            <h1 id="app-title" class="text-xl font-bold text-blue-600">Badminton Club</h1>
            <div id="admin-indicator" class="hidden">
                <span class="bg-blue-100 text-blue-700 text-xs font-semibold px-2.5 py-0.5 rounded-full">Admin</span>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main-content" class="flex-grow p-4 pb-24">
            <!-- Sections will be injected here -->
            <div id="loading-state" class="hidden flex flex-col items-center justify-center py-20">
                <div class="loader mb-4"></div>
                <p class="text-slate-500">Loading...</p>
            </div>
            
            <section id="content-area"></section>
        </main>

        <!-- Navigation Bar (Admin Only / Contextual) -->
        <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t flex justify-around p-3 z-50">
            <button data-route="poll" class="nav-btn flex flex-col items-center text-slate-400">
                <i data-lucide="vote"></i>
                <span class="text-xs">Poll</span>
            </button>
            <button data-route="admin" class="nav-btn flex flex-col items-center text-slate-400">
                <i data-lucide="layout-dashboard"></i>
                <span class="text-xs">Admin</span>
            </button>
            <button data-route="history" class="nav-btn flex flex-col items-center text-slate-400 hidden" id="nav-history">
                <i data-lucide="history"></i>
                <span class="text-xs">History</span>
            </button>
        </nav>

        <!-- Toast Container -->
        <div id="toast-container" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 w-full max-w-xs px-4 pointer-events-none z-[60]"></div>
    </div>

    <!-- Templates (Off-screen for html2canvas) -->
    <div id="templates-offscreen" style="position: absolute; left: -9999px; top: 0;">
        <!-- Billing Poster Template -->
        <div id="poster-template" class="p-6 bg-white w-[350px] border">
            <div class="text-center mb-4">
                <h2 class="text-2xl font-bold text-blue-600 uppercase" id="poster-club-name"></h2>
                <p class="text-slate-500 text-sm" id="poster-date"></p>
            </div>
            <div class="space-y-2 mb-4 border-y py-3 text-slate-700">
                <div class="flex justify-between"><span>Court Fee</span><span id="poster-court" class="font-medium text-slate-900"></span></div>
                <div class="flex justify-between"><span>Shuttle Fee</span><span id="poster-shuttle" class="font-medium text-slate-900"></span></div>
                <div class="flex justify-between font-semibold border-t pt-2"><span>Total Players</span><span id="poster-count" class="text-slate-900"></span></div>
                <div class="flex justify-between text-lg font-bold text-blue-600"><span>Each Pays</span><span id="poster-amount"></span></div>
            </div>
            <div class="mb-4">
                <p class="text-xs font-bold text-slate-400 uppercase mb-1">Players</p>
                <p class="text-sm leading-relaxed text-slate-600" id="poster-names"></p>
            </div>
            <div class="flex justify-center mt-6">
                <div id="poster-qr" class="p-2 bg-white border-2 border-slate-100 rounded-xl"></div>
            </div>
            <p class="text-center text-[10px] text-slate-400 mt-6 tracking-widest uppercase font-bold">Scan with any UPI App</p>
        </div>
    </div>

    <!-- JS Scripts -->
    <script>
        window.onerror = function(msg, url, line) {
            alert("Error: " + msg + "\nURL: " + url + "\nLine: " + line);
        };
    </script>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
